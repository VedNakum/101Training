<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controls Quiz · Argonauts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #fff8e8;
      --paper-2: #ffe9c2;
      --ink: #1e2430;
      --blue: #2b5fff;
      --red: #e23d2a;
      --green: #1f9a5c;
      --yellow: #ffe566;
      --pink: #ffb4c8;
      --sky: #a8d4ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background-color: #f3ead6;
      background-image:
        radial-gradient(circle at 12% 18%, #ffd6e0 0 70px, transparent 72px),
        radial-gradient(circle at 88% 12%, #c9e7ff 0 90px, transparent 92px),
        radial-gradient(circle at 80% 78%, #ffe56688 0 110px, transparent 112px),
        radial-gradient(circle at 18% 82%, #b8f0c988 0 80px, transparent 82px),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgba(43, 95, 255, 0.06) 27px,
          rgba(43, 95, 255, 0.06) 28px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 27px,
          rgba(43, 95, 255, 0.05) 27px,
          rgba(43, 95, 255, 0.05) 28px
        );
      overflow-x: hidden;
    }

    /* doodle scribbles in corners */
    .doodle {
      position: fixed;
      pointer-events: none;
      font-family: "Caveat", cursive;
      color: var(--blue);
      opacity: 0.45;
      z-index: 0;
      line-height: 1;
      user-select: none;
    }
    .doodle.a { top: 4%; left: 3%; font-size: 2.4rem; transform: rotate(-12deg); }
    .doodle.b { top: 8%; right: 4%; font-size: 1.8rem; transform: rotate(8deg); color: var(--red); }
    .doodle.c { bottom: 6%; left: 5%; font-size: 2rem; transform: rotate(6deg); color: #1f9a5c; }
    .doodle.d { bottom: 10%; right: 6%; font-size: 2.2rem; transform: rotate(-7deg); }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 18px 16px 48px;
      min-height: 100vh;
    }

    /* tiny header — not a start page */
    .mast {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .mast h1 {
      font-family: "Caveat", cursive;
      font-size: clamp(2rem, 7vw, 2.7rem);
      font-weight: 700;
      line-height: 1;
      transform: rotate(-1.5deg);
    }
    .mast h1 em {
      font-style: normal;
      color: var(--blue);
      border-bottom: 3px solid var(--yellow);
    }
    .mast .bits {
      font-family: "Caveat", cursive;
      font-size: 1.25rem;
      color: #555;
      transform: rotate(2deg);
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .ticket {
      background: var(--yellow);
      border: 2.5px solid var(--ink);
      border-radius: 4px 12px 4px 12px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(-2deg);
    }
    .ticket.streak {
      background: var(--pink);
      transform: rotate(1.5deg);
    }

    .track {
      flex: 1;
      min-width: 120px;
      height: 14px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      overflow: hidden;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .track > i {
      display: block;
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        -45deg,
        var(--blue),
        var(--blue) 6px,
        #5a82ff 6px,
        #5a82ff 12px
      );
      transition: width 0.35s ease;
    }

    /* question sheet — slightly crooked paper */
    .sheet {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 6px 18px 8px 14px;
      padding: 22px 20px 20px;
      box-shadow:
        6px 6px 0 var(--ink),
        inset 0 0 0 1px rgba(255,255,255,0.5);
      position: relative;
      transform: rotate(-0.4deg);
      animation: plop 0.4s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }
    .sheet::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 28%;
      width: 90px;
      height: 22px;
      background: rgba(168, 212, 255, 0.75);
      border: 2px solid var(--ink);
      transform: rotate(-3deg);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    }
    .sheet.bump {
      animation: bump 0.35s ease;
    }

    @keyframes plop {
      from { opacity: 0; transform: rotate(2deg) translateY(18px) scale(0.97); }
      to { opacity: 1; transform: rotate(-0.4deg) translateY(0) scale(1); }
    }
    @keyframes bump {
      0% { transform: rotate(-0.4deg) scale(1); }
      40% { transform: rotate(0.6deg) scale(1.015); }
      100% { transform: rotate(-0.4deg) scale(1); }
    }

    .q-label {
      font-family: "Caveat", cursive;
      font-size: 1.35rem;
      color: var(--blue);
      margin-bottom: 4px;
    }

    .q-text {
      font-size: clamp(1.2rem, 3.6vw, 1.55rem);
      font-weight: 900;
      line-height: 1.28;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .q-aside {
      font-family: "Caveat", cursive;
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 18px;
      transform: rotate(-0.5deg);
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 3px 3px 0 transparent;
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    }
    .choice:nth-child(1) { transform: rotate(-0.6deg); }
    .choice:nth-child(2) { transform: rotate(0.5deg); }
    .choice:nth-child(3) { transform: rotate(-0.3deg); }
    .choice:nth-child(4) { transform: rotate(0.7deg); }

    .choice:hover:not(:disabled) {
      box-shadow: 3px 3px 0 var(--ink);
      background: var(--yellow);
    }
    .choice:nth-child(1):hover:not(:disabled) { transform: rotate(-0.6deg) translate(-2px, -2px); }
    .choice:nth-child(2):hover:not(:disabled) { transform: rotate(0.5deg) translate(-2px, -2px); }
    .choice:nth-child(3):hover:not(:disabled) { transform: rotate(-0.3deg) translate(-2px, -2px); }
    .choice:nth-child(4):hover:not(:disabled) { transform: rotate(0.7deg) translate(-2px, -2px); }

    .choice:disabled { cursor: default; }

    .letter {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      display: grid;
      place-items: center;
      font-family: "Caveat", cursive;
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--sky);
      line-height: 1;
    }

    .choice.yes {
      background: #c8f5d8;
      box-shadow: 3px 3px 0 var(--green);
      animation: wiggle 0.4s ease;
    }
    .choice.yes .letter { background: var(--green); color: #fff; border-color: var(--ink); }
    .choice.no {
      background: #ffd0c8;
      box-shadow: 3px 3px 0 var(--red);
      animation: nope 0.35s ease;
    }
    .choice.no .letter { background: var(--red); color: #fff; }
    .choice.fade { opacity: 0.35; }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg) scale(1.02); }
      75% { transform: rotate(2deg) scale(1.02); }
    }
    @keyframes nope {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-5px) rotate(-1deg); }
      60% { transform: translateX(5px) rotate(1deg); }
    }

    /* sticky-note feedback */
    .note {
      display: none;
      margin-top: 16px;
      background: var(--yellow);
      border: 2.5px solid var(--ink);
      padding: 12px 14px;
      font-family: "Caveat", cursive;
      font-size: 1.35rem;
      line-height: 1.3;
      transform: rotate(1.2deg);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.18);
      position: relative;
    }
    .note.show { display: block; animation: plop 0.35s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
    .note.bad {
      background: var(--pink);
      transform: rotate(-1deg);
    }
    .note::after {
      content: "✧";
      position: absolute;
      top: -10px;
      right: 10px;
      font-size: 1.2rem;
    }

    .go {
      display: none;
      margin-top: 14px;
      justify-content: flex-end;
    }
    .go.show { display: flex; }

    .btn {
      appearance: none;
      border: 2.5px solid var(--ink);
      background: var(--blue);
      color: #fff;
      font-family: "Nunito", sans-serif;
      font-weight: 900;
      font-size: 1rem;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(1deg);
    }
    .btn:hover { background: #1a48d6; transform: rotate(1deg) translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .btn:active { transform: rotate(1deg) translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .btn.ghost {
      background: transparent;
      color: var(--ink);
      box-shadow: none;
      text-decoration: underline;
      text-underline-offset: 3px;
      border: none;
      transform: none;
    }
    .btn.ghost:hover { background: transparent; box-shadow: none; transform: none; color: var(--blue); }

    /* results — scrapbook page */
    #results { display: none; }
    #results.on { display: block; }
    #quiz { display: block; }
    #quiz.off { display: none; }

    .scrap {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 10px 6px 16px 8px;
      padding: 28px 22px;
      box-shadow: 7px 7px 0 var(--ink);
      text-align: center;
      position: relative;
      transform: rotate(0.5deg);
      animation: plop 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }
    .scrap .stamp {
      display: inline-block;
      font-family: "Caveat", cursive;
      font-size: 1.4rem;
      border: 3px dashed var(--red);
      color: var(--red);
      padding: 2px 14px;
      border-radius: 6px;
      transform: rotate(-8deg);
      margin-bottom: 8px;
    }
    .scrap .mega {
      font-family: "Caveat", cursive;
      font-size: clamp(4rem, 18vw, 6.5rem);
      line-height: 0.9;
      color: var(--blue);
      margin: 4px 0;
    }
    .scrap h2 {
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 900;
      margin-bottom: 6px;
    }
    .scrap .blurb {
      font-family: "Caveat", cursive;
      font-size: 1.35rem;
      color: #444;
      max-width: 28ch;
      margin: 0 auto 20px;
      line-height: 1.25;
    }
    .row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .row span {
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 0.85rem;
      transform: rotate(-1deg);
    }
    .row span:nth-child(2) { transform: rotate(1.5deg); background: var(--yellow); }
    .row span:nth-child(3) { transform: rotate(-0.8deg); background: var(--sky); }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
    }

    .foot {
      text-align: center;
      margin-top: 18px;
      font-family: "Caveat", cursive;
      font-size: 1.15rem;
      color: #777;
      transform: rotate(-1deg);
    }

    @media (max-width: 480px) {
      .sheet::before { left: 18%; width: 70px; }
    }
  </style>
</head>
<body>
  <div class="doodle a" aria-hidden="true">⚡ zap</div>
  <div class="doodle b" aria-hidden="true">beep beep</div>
  <div class="doodle c" aria-hidden="true">✓ strapped??</div>
  <div class="doodle d" aria-hidden="true">AprilTag ★</div>

  <div class="wrap">
    <header class="mast">
      <h1>controls <em>quiz</em></h1>
      <div class="bits">argonauts · no peeking</div>
    </header>

    <div id="quiz">
      <div class="hud">
        <div class="ticket" id="pts">0 pts</div>
        <div class="ticket streak" id="streak">streak 0</div>
        <div class="track" aria-hidden="true"><i id="bar"></i></div>
      </div>

      <div class="sheet" id="sheet">
        <div class="q-label" id="qLabel">q 1 of 12</div>
        <h2 class="q-text" id="qText"></h2>
        <p class="q-aside" id="qAside"></p>
        <div class="choices" id="choices"></div>
        <div class="note" id="note"></div>
        <div class="go" id="go">
          <button class="btn" id="next" type="button">next one →</button>
        </div>
      </div>
    </div>

    <div id="results">
      <div class="scrap">
        <div class="stamp" id="stamp">graded!!</div>
        <div class="mega" id="final">0</div>
        <h2 id="title">…</h2>
        <p class="blurb" id="blurb"></p>
        <div class="row">
          <span id="s1">0 correct</span>
          <span id="s2">best streak 0</span>
          <span id="s3">0%</span>
        </div>
        <div class="actions">
          <button class="btn" id="again" type="button">do it again ★</button>
        </div>
      </div>
      <p class="foot">coding + electrical = controls (mechanical still matters :D)</p>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      {
        q: "Controls owns which two things on the team?",
        aside: "(hint: brains of the robot…)",
        choices: [
          "Coding and Electrical",
          "Mechanical and Marketing",
          "Strategy and Scouting only",
          "Just the drivetrain"
        ],
        answer: 0,
        tip: "Yep — coding (Java, vision, autos…) AND electrical (wiring, battery, motors)."
      },
      {
        q: "What language is the robot code in?",
        aside: "not a trick question. mostly.",
        choices: ["Python", "C++", "Java", "Scratch"],
        answer: 2,
        tip: "Java!! With VS Code + WPILib."
      },
      {
        q: "Which is NOT one of the four things everyone should solo?",
        aside: "battery → connect → comms → Elastic",
        choices: [
          "Load the battery",
          "Rewrite autonomous from scratch",
          "Check Driver Station comms",
          "Open Elastic"
        ],
        answer: 1,
        tip: "Autos can wait. The four basics are battery, connect, comms, Elastic."
      },
      {
        q: "What's a roboRIO, really?",
        aside: "the little blue box of destiny",
        choices: [
          "A spare battery connector",
          "The robot's main computer — runs code, talks to motors",
          "A joystick mapping app",
          "Our WiFi password"
        ],
        answer: 1,
        tip: "Main computer. Sensors in, motor commands out."
      },
      {
        q: "PDH stands for… and it does what?",
        aside: "power stuff!!",
        choices: [
          "Pretty Darn Hub — stores GitHub repos",
          "Power Distribution Hub — splits battery power onto breakers",
          "Pixel Drawing Helper — AprilTag overlays",
          "PID Helper Device — tunes gains for you"
        ],
        answer: 1,
        tip: "Power Distribution Hub. Battery → breakers → everything that needs juice."
      },
      {
        q: "What's fancy about Kraken motors?",
        aside: "less spaghetti wiring energy",
        choices: [
          "They only work wirelessly",
          "Motor controller is built in",
          "They don't need power",
          "Code can't set their speed"
        ],
        answer: 1,
        tip: "Controller built in — tell 'em how fast or where to go."
      },
      {
        q: "Battery first step from the slides?",
        aside: "before you plug anything in…",
        choices: [
          "Open Elastic",
          "Face up — text faces you",
          "Yeet the breaker into the void",
          "Connect WiFi first"
        ],
        answer: 1,
        tip: "Face up → route leads nice → plug in → strap with velcro/belt."
      },
      {
        q: "Tethered (ethernet) connection — laptop WiFi?",
        aside: "don't let the networks fight",
        choices: [
          "Turn WiFi off",
          "Also join guest WiFi for vibes",
          "Airplane mode the robot",
          "Leave WiFi on, it's fine"
        ],
        answer: 0,
        tip: "Ethernet in, WiFi off. Radio needs ~2 min after boot btw."
      },
      {
        q: "Comms look good when…",
        aside: "Driver Station center indicators",
        choices: [
          "They're all fully green",
          "RSL blinks purple forever",
          "Elastic camera is blank",
          "GitHub says synced"
        ],
        answer: 0,
        tip: "All green in the middle. Joysticks: USB tab, mash buttons, watch 'em flash."
      },
      {
        q: "Elastic is for…",
        aside: "our dashboard buddy",
        choices: [
          "Writing Java files",
          "Camera feeds + live sensor values",
          "Ordering motors",
          "Flashing PDH firmware"
        ],
        answer: 1,
        tip: "Set Dashboard Type → Elastic in Driver Station, or open from WPILib in VS Code."
      },
      {
        q: "Blank camera/value in Elastic — check what first?",
        aside: "it can't invent data",
        choices: [
          "Your GitHub avatar",
          "Comms (it only shows what the robot sends)",
          "Whether the lights are on",
          "Battery brand"
        ],
        answer: 1,
        tip: "Comms first. Always."
      },
      {
        q: "Robot.java is…",
        aside: "subsystems hang out underneath",
        choices: [
          "A dusty unused template",
          "The main file — overall behavior + calling subsystems",
          "Only shooter config",
          "The Driver Station installer"
        ],
        answer: 1,
        tip: "Main file. Drivetrain, Shooter, Intake, Climber = subsystems."
      },
      {
        q: "Write / store / talk-to-hardware trio?",
        aside: "IDE · hosting · library",
        choices: [
          "VS Code · GitHub · WPILib",
          "Word · Dropbox · Excel",
          "Notion · Discord · Photoshop",
          "Eclipse · MySQL · TensorFlow"
        ],
        answer: 0,
        tip: "That's the stack. Beginners can use GitHub Desktop too."
      },
      {
        q: "Why bother with GitHub?",
        aside: "we like GitHub. (the slides said so)",
        choices: [
          "Memes only",
          "Shared repo, history, less lost code, everyone in sync",
          "It replaces the roboRIO",
          "FRC bans local files"
        ],
        answer: 1,
        tip: "One repo, undo-button history, laptop dies ≠ code dies."
      },
      {
        q: "AprilTags help the robot know…",
        aside: "those nerdy black & white squares",
        choices: [
          "Battery voltage",
          "Where it is on the field (distance & angle to known tags)",
          "Who's driving",
          "Which git branch you're on"
        ],
        answer: 1,
        tip: "See a tag → distance/angle → where am I?? (also: shoot on the move)"
      }
    ];

    const LETTERS = ["a", "b", "c", "d"];
    let deck = [];
    let i = 0;
    let score = 0;
    let streak = 0;
    let best = 0;
    let correct = 0;
    let locked = false;

    const $ = (id) => document.getElementById(id);

    function shuffle(arr) {
      const a = [...arr];
      for (let n = a.length - 1; n > 0; n--) {
        const j = Math.floor(Math.random() * (n + 1));
        [a[n], a[j]] = [a[j], a[n]];
      }
      return a;
    }

    function start() {
      deck = shuffle(QUESTIONS).slice(0, 12);
      i = 0;
      score = 0;
      streak = 0;
      best = 0;
      correct = 0;
      locked = false;
      $("pts").textContent = "0 pts";
      $("streak").textContent = "streak 0";
      $("quiz").classList.remove("off");
      $("results").classList.remove("on");
      draw();
    }

    function draw() {
      locked = false;
      const item = deck[i];
      const sheet = $("sheet");
      sheet.classList.remove("bump");
      void sheet.offsetWidth;
      sheet.style.animation = "none";
      void sheet.offsetWidth;
      sheet.style.animation = "";

      $("qLabel").textContent = `q ${i + 1} of ${deck.length}`;
      $("qText").textContent = item.q;
      $("qAside").textContent = item.aside;
      $("bar").style.width = `${(i / deck.length) * 100}%`;

      const note = $("note");
      note.className = "note";
      note.textContent = "";
      $("go").classList.remove("show");
      $("next").textContent = i === deck.length - 1 ? "grade me →" : "next one →";

      const box = $("choices");
      box.innerHTML = "";
      item.choices.forEach((text, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${text}</span>`;
        btn.addEventListener("click", () => pick(idx, btn));
        box.appendChild(btn);
      });
    }

    function pick(choice, btn) {
      if (locked) return;
      locked = true;
      const item = deck[i];
      const buttons = [...$("choices").querySelectorAll(".choice")];
      buttons.forEach((b) => (b.disabled = true));

      const note = $("note");
      if (choice === item.answer) {
        btn.classList.add("yes");
        correct++;
        streak++;
        best = Math.max(best, streak);
        const bonus = 100 + Math.min(streak - 1, 4) * 25;
        score += bonus;
        note.className = "note show";
        note.textContent = `heck yeah (+${bonus}) — ${item.tip}`;
      } else {
        btn.classList.add("no");
        buttons[item.answer].classList.add("yes");
        buttons.forEach((b, n) => {
          if (n !== item.answer && n !== choice) b.classList.add("fade");
        });
        streak = 0;
        note.className = "note show bad";
        note.textContent = `oop — ${item.tip}`;
      }

      $("pts").textContent = `${score} pts`;
      $("streak").textContent = `streak ${streak}`;
      $("bar").style.width = `${((i + 1) / deck.length) * 100}%`;
      $("sheet").classList.add("bump");
      $("go").classList.add("show");
    }

    function next() {
      if (i >= deck.length - 1) {
        finish();
        return;
      }
      i++;
      draw();
    }

    function finish() {
      const pct = Math.round((correct / deck.length) * 100);
      $("final").textContent = score;
      $("s1").textContent = `${correct}/${deck.length} correct`;
      $("s2").textContent = `best streak ${best}`;
      $("s3").textContent = `${pct}%`;

      let title, blurb, stamp;
      if (pct === 100) {
        title = "battery strapped legend";
        blurb = "perfect. go green up those comms like you own the pit.";
        stamp = "100% !!";
      } else if (pct >= 80) {
        title = "almost a senior mentor";
        blurb = "super solid. skim the oopsies and you're set.";
        stamp = "nice job";
      } else if (pct >= 55) {
        title = "still booting…";
        blurb = "radio takes ~2 minutes. you might too. try again!!";
        stamp = "keep going";
      } else {
        title = "comms… blinking?";
        blurb = "flip back through the slides, then mash \"do it again.\"";
        stamp = "retry time";
      }
      $("title").textContent = title;
      $("blurb").textContent = blurb;
      $("stamp").textContent = stamp;

      $("quiz").classList.add("off");
      $("results").classList.add("on");
    }

    $("next").addEventListener("click", next);
    $("again").addEventListener("click", start);
    start();
  </script>
</body>
</html>
